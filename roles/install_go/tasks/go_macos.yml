---
- name: Make Download dir
  ansible.builtin.file:
    path: "{{ go_download_dir_mac }}"
    state: directory

- name: Make Install dir
  ansible.builtin.file:
    path: "{{ go_install_dir_mac }}"
    state: directory

# Download 
- name: Download Go (for x86_64)
  ansible.builtin.get_url:
    url: "{{ go_url_x86_64_mac }}"
    dest: "{{ go_download_dir_mac }}/"
  when: ansible_facts["architecture"] == 'x86_64'
  register: download_go1

- name: Download Go (for aarch64)
  ansible.builtin.get_url:
    url: "{{ go_url_aarch64_mac }}"
    dest: "{{ go_download_dir_mac }}/"
  when: ansible_facts["architecture"] in ['arm64', 'aarch64']
  register: download_go2

# Extract, set path and fix quarantine / cache permissions
- name: Extracting Go
  ansible.builtin.shell:
    cmd: |
      rm -rf {{ go_install_dir_mac }}/go
      tar -C {{ go_install_dir_mac }} -xzf {{ go_download_dir_mac }}/{{ go_version }}*.tar.gz
      xattr -dr com.apple.quarantine {{ go_install_dir_mac }}/go 2>/dev/null || true
      [ -d "{{ ansible_env.HOME }}/Library/Caches/go-build" ] && chown -R {{ ansible_env.USER }}:staff "{{ ansible_env.HOME }}/Library/Caches/go-build" || true
  changed_when: false
  when: (download_go1.changed) or (download_go2.changed) or not (go_install_dir_mac + '/go/bin/go') is file

- name: Configure PATH and GOPATH variable
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    block: |
      export GOPATH="{{ go_path }}"
      export PATH="{{ go_install_dir_mac }}/go/bin:$GOPATH/bin:$PATH"
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR GO PATH"

- name: Cleanup (Remove Go installation package)
  ansible.builtin.shell:
    cmd: rm -f {{ go_download_dir_mac }}/{{ go_version }}*.tar.gz
  when: cleanup_go_installer